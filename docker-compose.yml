services:
  lyrion-dashboard:
    image: ghcr.io/werdeil/lyrion-dashboard:latest
    # To run this checkout's sources instead of the published image, uncomment:
    # build: .
    container_name: lyrion-dashboard
    restart: unless-stopped
    ports:
      - "1111:1111"
    environment:
      - LYRION_HOST=https://lyrion.local:9000
      - TZ=Europe/Paris
      # Optional, all documented on docs/configuration.md:
      # - PLAY_COUNTS_SOURCE=auto
      # - LYRICS_PROVIDERS=lrclib,musixmatch,genius
      # - MUSIXMATCH_TOKEN=
      # - LRCLIB_TIMEOUT=15
      # - LOG_LEVEL=INFO
    volumes:
      # Left of each colon: a path on your machine. The first is Lyrion's data
      # directory, the one holding its prefs/ and cache/.
      - /var/lib/squeezeboxserver:/lyrion:ro
      - /opt/scripts/custom_data:/opt/scripts/custom_data
