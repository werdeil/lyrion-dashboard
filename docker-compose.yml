services:
  lyrion-dashboard:
    image: ghcr.io/werdeil/lyrion-dashboard:latest
    container_name: lyrion-dashboard
    restart: unless-stopped
    ports:
      - "1111:1111"
    environment:
      - LYRION_HOST=https://lyrion.local:9000
      - TZ=Europe/Paris
      # Optional, all documented on docs/configuration.md:
      # - PLAY_COUNTS_SOURCE=auto
      # - LYRICS_PROVIDERS=lrclib,musixmatch,genius
      # - MUSIXMATCH_TOKEN=
      # - LRCLIB_TIMEOUT=15
      # - LOG_LEVEL=INFO
    volumes:
      - /var/lib/squeezeboxserver:/lyrion:ro
      - /opt/scripts/custom_data:/opt/scripts/custom_data
